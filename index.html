<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jaro&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Dream</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    canvas { display: block; }
    #views { position: fixed; top: 16px; right: 16px; z-index: 10; display: flex; flex-direction: column; transform: scale(0.85); transform-origin: top right;
      align-items: flex-end; gap: 10px; font-family: 'Jaro', sans-serif; }
    #bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 24px;
      background: rgba(0, 0, 0, 0.7); }
    #bar .label { color: #58F7FF; font-size: 22px; letter-spacing: 1px; padding: 0 6px; }
    #bar .ibtn { width: 45px; height: 45px; padding: 0; border: none; background: none; cursor: pointer;
      color: #58F7FF; display: flex; align-items: center; justify-content: center; }
    #bar .ibtn svg { display: block; }
    #bar .ibtn:hover, #bar .ibtn.active { color: #fff; }
    #bar #creditBtn { width: 104px; height: 45px; border-radius: 11px; border: 2px solid #fff; background: #141414;
      color: #fff; font-family: 'Jaro', sans-serif; font-size: 20px; cursor: pointer; padding: 0; transition: background 0.15s, color 0.15s; }
    #bar #creditBtn:hover { background: #2a2a2a; }
    #bar #creditBtn.active { background: #fff; color: #141414; }
    #bar #creditBtn.active:hover { background: #f0f0f0; color: #141414; }
    #credit-msg { display: none; max-width: 300px; padding: 16px 20px; border-radius: 16px;
      background: rgba(0, 0, 0, 0.7); color: #fff; font-family: 'Jaro', sans-serif; font-size: 18px; line-height: 1.5; }
    #credit-msg.show { display: block; }
    #credit-msg a { color: #58F7FF; }
    #credit-msg a:hover { color: #fff; }
    #actions { position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 10; }
    #actions button { width: 48px; height: 48px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(74, 42, 22, 0.35); background: rgba(255, 246, 230, 0.9);
      font-size: 22px; line-height: 1; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
    #actions button:hover { background: #fff3dc; }
    #hud { position: fixed; top: 16px; left: 16px; z-index: 10; display: flex; align-items: center; gap: 12px;
      transform: scale(0.85); transform-origin: top left; font-family: 'Jaro', sans-serif; }
    #hud .box { padding: 10px 20px; border-radius: 14px; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; gap: 14px; }
    #hud .scoreBox { border: 2px solid #58F7FF; color: #58F7FF; }
    #hud .label { font-size: 22px; letter-spacing: 2px; color: #58F7FF; }
    #hud .score { display: inline-block; font-size: 40px; color: #e8fbff; min-width: 60px; text-align: right; }
    #hud .restartBtn { border: 2px solid #7CFF6B; border-radius: 14px; background: rgba(0, 0, 0, 0.7); color: #7CFF6B;
      font-family: 'Jaro', sans-serif; font-size: 24px; padding: 10px 26px; cursor: pointer; transition: background 0.15s, color 0.15s; }
    #hud .restartBtn:hover { background: #7CFF6B; color: #05130a; }
    #hud .restartBtn:active { transform: scale(0.96); }
    #hud .score.bump { animation: bump 0.35s ease-out; }
    @keyframes bump { 0% { transform: scale(1.5); color: #ffe14d; } 100% { transform: scale(1); color: #e8fbff; } }
    .pop-text { position: fixed; left: 50%; top: 36%; transform: translateX(-50%); z-index: 11; pointer-events: none;
      color: #ffe14d; font: bold 28px 'Courier New', monospace; text-shadow: 0 0 12px #ffe14d;
      animation: floatUp 1s ease-out forwards; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -60px) scale(1.3); } }
    #flash { position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: 0;
      background: radial-gradient(circle, rgba(255, 230, 120, 0.35), rgba(255, 230, 120, 0)); }
    #start { position: fixed; inset: 0; z-index: 20; display: block;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.85)); color: #fff;
      font-family: 'Courier New', monospace; }
    #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 22px; }
    #banner { position: relative;
      width: min(56vw, 80vh); aspect-ratio: 2335 / 1314; border-radius: 28px; overflow: hidden;
      border: 2px solid #49E7FF; box-sizing: border-box;
      background: #000 url('Banner.webp') center / cover no-repeat;
      animation: bannerGlow 2.4s ease-in-out infinite; }
    @keyframes bannerGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(46, 246, 255, 0.45), 0 0 40px rgba(255, 46, 136, 0.25); }
      50% { box-shadow: 0 0 36px rgba(46, 246, 255, 0.95), 0 0 80px rgba(255, 46, 136, 0.6); } }
    #start .howto { display: flex; gap: 40px; align-items: center; justify-content: center; color: #fff; font-family: 'Jaro', sans-serif; font-size: 16px; letter-spacing: 1px; }
    #start .tip { display: flex; align-items: center; gap: 12px; color: #fff; white-space: nowrap; }
    #start .trackpad { position: relative; width: 72px; height: 50px; border: 2px solid #fff; border-radius: 12px; overflow: hidden; color: #fff; background: rgba(255, 255, 255, 0.08); }
    #start .trackpad .hand { position: absolute; width: 26px; height: 28px; left: 6px; top: 10px; animation: handMove 2.4s ease-in-out 2 both; }
    @keyframes handMove { 0% { transform: translateX(0); } 50% { transform: translateX(36px); } 100% { transform: translateX(0); } }
    #start .keys { display: flex; gap: 6px; }
    #start .key { min-width: 44px; height: 44px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid #fff; border-radius: 8px; color: #fff; font-size: 22px; font-weight: bold; background: rgba(255, 255, 255, 0.08); }
    #start .up { width: 22px; height: 22px; display: block; }
    #start .key.wide { min-width: 120px; font-size: 16px; letter-spacing: 2px; }
    #start .tagline { font-size: 14px; letter-spacing: 1px; color: #fff; white-space: nowrap; text-shadow: 0 0 8px #000; }
    #start .title { font-size: 46px; font-weight: bold; letter-spacing: 6px; color: #2ef6ff;
      text-shadow: 0 0 18px #2ef6ff, 0 0 40px #2ef6ff; }
    #start .sub { font-size: 16px; letter-spacing: 2px; color: #9fe8ff; }
    #start button { position: absolute; left: 50%; top: 76.5%; transform: translate(-50%, -50%);
      width: 28%; height: auto; min-width: 120px; padding: 22px 40px 24px; line-height: 1; font: 26px 'Jaro', sans-serif; letter-spacing: 1px;
      color: #05060a; background: rgba(73, 231, 255, 0.7); border: 4px solid #49E7FF; border-radius: 12px; cursor: pointer;
      box-shadow: 0 0 14px rgba(73, 231, 255, 0.6), inset 0 0 10px rgba(73, 231, 255, 0.25);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
    #start button:hover { background: #49E7FF; color: #05060a; box-shadow: 0 0 28px rgba(73, 231, 255, 0.95); }
    #hurt { position: fixed; inset: 0; pointer-events: none; z-index: 8; opacity: 0;
      background: radial-gradient(circle, rgba(255, 30, 60, 0.05), rgba(255, 30, 60, 0.55)); }
    #hud .score.lose { animation: loseShake 0.45s ease-out; }
    @keyframes loseShake { 0%, 100% { transform: translateX(0); color: #e8fbff; }
      20% { transform: translateX(-7px); color: #ff3b5c; } 40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
    .pop-text.lose { color: #ff3b5c; text-shadow: 0 0 12px #ff3b5c; }
    #gameover { position: fixed; inset: 0; z-index: 21; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; text-align: center;
      background: radial-gradient(circle, rgba(40, 0, 16, 0.6), rgba(10, 0, 4, 0.9));
      color: #ffd0e0; font-family: 'Jaro', sans-serif; }
    #gameover .title { font-size: 50px; font-weight: bold; letter-spacing: 6px; color: #ff3b5c;
      text-shadow: 0 0 18px #ff3b5c, 0 0 40px #ff3b5c; }
    #gameover .sub { font-size: 22px; letter-spacing: 3px; color: #ffe2ea; }
    #gameover .title { animation: titleIn 0.7s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes titleIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #gameover button { margin-top: 14px; padding: 16px 48px; font: bold 22px 'Jaro', sans-serif; letter-spacing: 4px;
      color: #fff; background: linear-gradient(180deg, #ff5d7a, #d81e47); border: 2px solid #ffd0dc; border-radius: 12px;
      cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: btnPulse 1.4s ease-in-out infinite, btnIn 0.6s 0.4s cubic-bezier(.2, 1.4, .4, 1) backwards; }
    #gameover button::before { content: '▶  '; }
    #gameover button:hover { transform: translateY(-4px) scale(1.06); background: linear-gradient(180deg, #ff7d95, #ff2a5a); }
    #gameover button:active { transform: translateY(2px) scale(0.96); }
    #win { position: fixed; inset: 0; z-index: 21; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; text-align: center; pointer-events: none;
      color: #fff3c4; font-family: 'Jaro', sans-serif; }
    #win.show { pointer-events: auto; }
    #win .title { font-size: 56px; font-weight: bold; letter-spacing: 6px; color: #ffd34d;
      text-shadow: 0 0 18px #ffd34d, 0 0 44px #ff9a2e; animation: titleIn 0.8s cubic-bezier(.2, 1.4, .4, 1) both; }
    #win .sub { font-size: 20px; letter-spacing: 3px; color: #ffe9a8; }
    #win button { margin-top: 14px; padding: 16px 48px; font: bold 22px 'Jaro', sans-serif; letter-spacing: 4px;
      color: #1a0f00; background: linear-gradient(180deg, #ffe27a, #ffb22e); border: 2px solid #fff3c4; border-radius: 12px;
      cursor: pointer; transition: transform 0.15s ease;
      animation: goldPulse 1.4s ease-in-out infinite, btnIn 0.6s 0.4s cubic-bezier(.2, 1.4, .4, 1) backwards; }
    #win button::before { content: '▶  '; }
    #win button:hover { transform: translateY(-4px) scale(1.06); }
    #win button:active { transform: translateY(2px) scale(0.96); }
    @keyframes goldPulse { 0%, 100% { box-shadow: 0 0 16px rgba(255, 211, 77, 0.6); }
      50% { box-shadow: 0 0 36px rgba(255, 211, 77, 1), 0 0 60px rgba(255, 154, 46, 0.5); } }
    #gameover button:focus-visible { outline: 3px solid #ffd34d; outline-offset: 4px; }
    @keyframes btnPulse { 0%, 100% { box-shadow: 0 0 16px rgba(255, 59, 92, 0.6); }
      50% { box-shadow: 0 0 36px rgba(255, 59, 92, 1), 0 0 60px rgba(255, 59, 92, 0.5); } }
    @keyframes btnIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #loader { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #03040a; font-family: 'Jaro', sans-serif; color: #49E7FF; transition: opacity 0.6s ease; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .lt { font-size: 34px; letter-spacing: 8px; text-shadow: 0 0 14px #49E7FF; animation: lpulse 1.2s ease-in-out infinite; }
    #loader .bar { width: min(60vw, 420px); height: 10px; border-radius: 6px; border: 2px solid #49E7FF; overflow: hidden;
      box-shadow: 0 0 14px rgba(73, 231, 255, 0.6); }
    #loader .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #49E7FF, #ff2e88); box-shadow: 0 0 12px #49E7FF; transition: width 0.2s; }
    #loader .by { font-size: 13px; letter-spacing: 2px; color: #fff; opacity: 0.8; margin-top: -14px; }
    #loader .pct { font-size: 18px; letter-spacing: 3px; color: #fff; }
    @keyframes lpulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.146.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.146.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loader"><div class="lt">NEON DREAM</div><div class="by">By Eiman Basirati</div><div class="bar"><div class="fill" id="lfill"></div></div><div class="pct" id="lpct">0%</div></div>
  <div id="views">
    <div id="bar">
      <span class="label">View</span>
      <button class="ibtn active" data-view="default" title="Default view"><svg width="45" height="45" viewBox="0 0 45 45" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="43" height="43" rx="11" stroke="currentColor" stroke-width="2"/><rect x="9.85828" y="13.3564" width="18.2877" height="18.2877" rx="3" stroke-width="2" stroke="currentColor"/><path d="M28.4465 18.991L34.634 15.3438C35.3006 14.9509 36.1418 15.4315 36.1418 16.2053V28.795C36.1418 29.5689 35.3006 30.0495 34.634 29.6565L28.4465 26.0091" stroke-width="2" stroke="currentColor"/></svg></button>
      <button class="ibtn" data-view="eye" title="Character view"><svg width="45" height="45" viewBox="0 0 45 45" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="43" height="43" rx="11" stroke="currentColor" stroke-width="2"/><path d="M8.23822 26.0171C9.54067 23.1517 14.2555 17.4209 22.6954 17.4209C31.1353 17.4209 35.5896 23.1517 36.7618 26.0171" stroke-width="2" stroke="currentColor"/><path d="M26.7912 18.07C27.6673 18.8801 28.2836 19.9318 28.5621 21.0921C28.8406 22.2524 28.7687 23.4692 28.3556 24.5887C27.9425 25.7081 27.2067 26.68 26.2413 27.3813C25.2759 28.0826 24.1242 28.4819 22.9318 28.5286C21.7395 28.5754 20.5601 28.2675 19.5427 27.6439C18.5253 27.0204 17.7157 26.1091 17.2162 25.0254C16.7167 23.9418 16.5498 22.7343 16.7366 21.5557C16.9233 20.3772 17.4554 19.2805 18.2655 18.4043" stroke-width="2" stroke="currentColor"/></svg></button>
      <button class="ibtn" data-view="close" title="Close-up"><svg width="45" height="45" viewBox="0 0 45 45" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="43" height="43" rx="11" stroke="currentColor" stroke-width="2"/><path d="M15.4728 8.44531H9.44525C8.89297 8.44531 8.44525 8.89303 8.44525 9.44531V15.3766" stroke-width="2" stroke="currentColor"/><path d="M29.5279 8.44531H35.5555C36.1078 8.44531 36.5555 8.89303 36.5555 9.44531V15.3766" stroke-width="2" stroke="currentColor"/><path d="M15.4728 36.5557H9.44525C8.89297 36.5557 8.44525 36.1079 8.44525 35.5557V29.6244" stroke-width="2" stroke="currentColor"/><path d="M29.5279 36.5557H35.5555C36.1078 36.5557 36.5555 36.1079 36.5555 35.5557V29.6244" stroke-width="2" stroke="currentColor"/><path d="M15.4726 22.501H29.5277" stroke-width="2" stroke="currentColor"/><path d="M22.5002 15.4727L22.5002 29.5278" stroke-width="2" stroke="currentColor"/></svg></button>
      <button id="creditBtn" type="button">Credit</button>
    </div>
    <div id="credit-msg">Game created by Eiman Basirati.<br>Learn more at:<br><a href="https://eimanbasirati.com" target="_blank" rel="noopener">eimanbasirati.com</a></div>
  </div>
  <div id="start">
    <div id="stage">
      <div id="banner">
        <button id="startBtn">START</button>
      </div>
      <div class="tagline">Wander the streets. Collect your fortune</div>
      <div class="howto">
        <div class="tip">
          <span class="trackpad"><svg class="hand" viewBox="0 0 65 71" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M28.2534 7.5C28.2534 5.01472 26.2387 3 23.7534 3C21.2681 3 19.2534 5.01472 19.2534 7.5V46.1211L10.6997 37.5684C8.86465 35.7333 5.86329 35.8211 4.13916 37.7607C2.55276 39.5457 2.63319 42.2577 4.32178 43.9463L23.1792 62.8047C26.5058 66.1313 31.0177 68 35.7222 68H46.3628C54.8628 68 61.7534 61.1094 61.7534 52.6094V28C61.7534 25.7909 59.9626 24 57.7534 24C55.5443 24 53.7534 25.7909 53.7534 28V36H50.7534V25.25C50.7534 22.9028 48.8506 21 46.5034 21C44.1562 21 42.2534 22.9028 42.2534 25.25V36H39.2534V24C39.2534 21.7909 37.4626 20 35.2534 20C33.0443 20 31.2534 21.7909 31.2534 24V36H28.2534V7.5ZM31.2534 18.2559C32.3874 17.4648 33.7659 17 35.2534 17C37.7638 17 39.9643 18.3223 41.1997 20.3076C42.5232 18.888 44.4095 18 46.5034 18C49.5833 18 52.2126 19.9212 53.2632 22.6299C54.4786 21.6125 56.0444 21 57.7534 21C61.6194 21 64.7534 24.134 64.7534 28V52.6094C64.7534 62.7662 56.5197 71 46.3628 71H35.7222C30.222 71 24.9473 68.815 21.0581 64.9258L2.19971 46.0684C-0.612092 43.2565 -0.74478 38.7397 1.89697 35.7676C4.76787 32.5378 9.76617 32.3907 12.8218 35.4463L16.2534 38.8779V7.5C16.2534 3.35786 19.6113 0 23.7534 0C27.8956 0 31.2534 3.35786 31.2534 7.5V18.2559Z" fill="currentColor"/></svg></span>
          <span>Move mouse to turn</span>
        </div>
        <div class="tip"><span class="keys"><span class="key"><svg class="up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span><span class="key">W</span></span><span>Walk forward</span></div>
        <div class="tip"><span class="keys"><span class="key wide">SPACE</span></span><span>Jump</span></div>

    </div>
  </div>
  <div id="gameover">
    <div class="title">GAME OVER</div>
    <div class="sub" id="final-score">SCORE 0</div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
  <div id="hurt"></div>
  <div id="win">
    <div class="title">YOU WIN!</div>
    <div class="sub">200 POINTS COLLECTED</div>
    <button id="restartWin">PLAY AGAIN</button>
  </div>
  <div id="flash"></div>
  <div id="hud">
    <div class="box scoreBox">
      <span class="label">SCORE</span>
      <span class="score" id="score">0</span>
    </div>
    <button class="restartBtn" id="restartHud" type="button">Restart</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

    const V3 = THREE.Vector3, Q = THREE.Quaternion;

    // --- Renderer / scene -------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));   // sharp on high-DPI screens
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // Night sky: black at the top, deep blue near the horizon, with stars.
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 256; skyCanvas.height = 512;
    {
      const g = skyCanvas.getContext('2d');
      const grd = g.createLinearGradient(0, 0, 0, 512);
      grd.addColorStop(0.0, '#000005');
      grd.addColorStop(0.45, '#02071a');
      grd.addColorStop(0.62, '#071a40');
      grd.addColorStop(0.8, '#0c3170');
      grd.addColorStop(1.0, '#0c3170');
      g.fillStyle = grd; g.fillRect(0, 0, 256, 512);
    }
    const skyTex = new THREE.CanvasTexture(skyCanvas);
    skyTex.encoding = THREE.sRGBEncoding;
    scene.background = skyTex;
    scene.fog = new THREE.Fog(0x000000, 12, 52);   // the far end of the street fades to black

    // Camera sits behind and above the character, looking slightly down
    // toward the horizon (horizon lands ~41% from the top of the screen).
    const CAM_OFFSET = new V3(0, 2.35, 4.5);
    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.copy(CAM_OFFSET);
    camera.rotation.x = THREE.MathUtils.degToRad(-6.5);

    scene.add(new THREE.HemisphereLight(0x4f8cff, 0x02040a, 0.7));   // cool blue fill
    // Warm key light from a lamp side, with soft shadows that follow the character.
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const sun = new THREE.DirectionalLight(0xffb27a, 1.3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
    sun.shadow.bias = -0.0008;
    sun.shadow.radius = 3;
    scene.add(sun, sun.target);
    const rimLight = new THREE.DirectionalLight(0x6fa8ff, 0.5);   // cold rim light from behind
    rimLight.position.set(4, 6, -10);

    const guitarMats = {
